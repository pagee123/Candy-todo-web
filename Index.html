<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍬 泡泡糖雲端同步作業</title>
	<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍬</text></svg>">
    <!-- 引入 Google Fonts 圓滾滾字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 50%, #ffd1ff 100%);
            --card-bg: rgba(255, 255, 255, 0.88);
            --primary-pink: #ff6b8b;
            --primary-purple: #c77dff;
            --text-color: #4a4e69;
            --shadow: 0 10px 25px rgba(255, 107, 139, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Varela Round', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-color);
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 420px;
            padding: 25px;
            border-radius: 30px;
            box-shadow: var(--shadow);
            border: 4px solid #ffffff;
        }

        .header-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--primary-pink);
            font-size: 24px;
            text-shadow: 2px 2px 0px #fff;
        }

        .sync-status {
            font-size: 12px;
            background: #ffe5e8;
            color: #ff6b8b;
            padding: 5px 10px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .sync-status:hover {
            background: #ffccd5;
        }

        /* 輸入區塊 */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 18px;
            border: 3px solid #ffccd5;
            border-radius: 20px;
            outline: none;
            font-size: 15px;
            background: #fff;
            color: var(--text-color);
            transition: 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--primary-pink);
            box-shadow: 0 0 10px rgba(255, 107, 139, 0.3);
        }

        button.add-btn {
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 117, 140, 0.4);
            transition: 0.2s;
        }

        button.add-btn:active {
            transform: scale(0.95);
        }

        /* 控制列 */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 14px;
            padding: 0 5px;
        }

        .toggle-label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
        }

        /* 清單區域 */
        ul {
            list-style: none;
            max-height: 380px;
            overflow-y: auto;
            padding-right: 5px;
        }

        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            padding: 12px 16px;
            border-radius: 18px;
            margin-bottom: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            border: 2px solid transparent;
            transition: 0.3s;
        }

        li.completed {
            background: #f8f9fa;
            opacity: 0.6;
            border-color: #e9ecef;
        }

        li.completed .task-text {
            text-decoration: line-through;
            color: #adb5bd;
        }

        .task-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            word-break: break-all;
        }

        /* 自訂勾選框 */
        input[type="checkbox"] {
            appearance: none;
            width: 22px;
            height: 22px;
            border: 3px solid #ffb3c6;
            border-radius: 50%;
            outline: none;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }

        input[type="checkbox"]:checked {
            background-color: var(--primary-pink);
            border-color: var(--primary-pink);
        }

        input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            color: white;
            font-size: 12px;
            top: 1px;
            left: 5px;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ffadb0;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 10px;
            transition: 0.2s;
        }

        .delete-btn:hover {
            color: #ff4757;
            background: #ffe5e8;
        }

        .empty-tip {
            text-align: center;
            color: #b8b8b8;
            margin-top: 30px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-box">
            <h1>🍡 泡泡糖作業清單</h1>
            <div class="sync-status" id="syncStatus" onclick="manualSync()" title="點擊手動同步">☁️ 已同步</div>
        </div>
        
        <!-- 新增作業表單 -->
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="今天要做什麼作業呢？✨" autocomplete="off">
            <button class="add-btn" onclick="addTask()">新增</button>
        </div>

        <!-- 篩選控制 -->
        <div class="controls">
            <span id="taskCount">剩餘 0 項未完成</span>
            <label class="toggle-label">
                <input type="checkbox" id="hideCompleted" onclick="renderTasks()">
                <span>隱藏已完成</span>
            </label>
        </div>

        <!-- 清單 -->
        <ul id="taskList"></ul>
    </div>

    <script>
        // ==========================================
        // ⚙️ JSONBin.io 設定區（免費雲端資料庫）
        // ==========================================
        const BIN_ID = "6ad1cfdeac6210605a36669f"; // 此處使用預設測試儲存區
        const API_KEY = "$2a$10$g36k67WogIXXMJjmvdbLcOXR05Kf24eta/RVzTn6/7DE6H6TWGyHC"; // (範例 Key，若要專屬空間可自行至 jsonbin.io 申請)

        let tasks = [];

        // 1. 從雲端載入資料
        async function fetchTasksFromCloud() {
            const statusEl = document.getElementById('syncStatus');
            statusEl.innerText = "🔄 同步中...";
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: {
                        'X-Master-Key': API_KEY
                    }
                });
                const data = await response.json();
                tasks = data.record.tasks || [];
                statusEl.innerText = "☁️ 已同步";
                renderTasks();
            } catch (error) {
                console.error("載入失敗:", error);
                statusEl.innerText = "⚠️ 離線模式";
                // 若雲端連線失敗，退回讀取本機暫存
                tasks = JSON.parse(localStorage.getItem('bubble_tasks_offline')) || [];
                renderTasks();
            }
        }

        // 2. 將資料儲存至雲端
        async function saveTasksToCloud() {
            const statusEl = document.getElementById('syncStatus');
            statusEl.innerText = "💾 儲存中...";
            
            // 同時備份到本機
            localStorage.setItem('bubble_tasks_offline', JSON.stringify(tasks));

            try {
                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify({ tasks: tasks })
                });
                statusEl.innerText = "☁️ 已同步";
            } catch (error) {
                console.error("儲存失敗:", error);
                statusEl.innerText = "⚠️ 儲存失敗";
            }
            renderTasks();
        }

        function manualSync() {
            fetchTasksFromCloud();
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            const text = input.value.trim();
            if(!text) return;

            tasks.push({
                id: Date.now(),
                text: text,
                completed: false
            });

            input.value = '';
            saveTasksToCloud();
        }

        document.getElementById('taskInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') addTask();
        });

        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if(task) {
                task.completed = !task.completed;
                saveTasksToCloud();
            }
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveTasksToCloud();
        }

        function renderTasks() {
            const listEl = document.getElementById('taskList');
            const hideCompleted = document.getElementById('hideCompleted').checked;
            
            listEl.innerHTML = '';

            let activeCount = tasks.filter(t => !t.completed).length;
            document.getElementById('taskCount').innerText = `剩餘 ${activeCount} 項未完成`;

            const filteredTasks = tasks.filter(t => {
                if (hideCompleted && t.completed) return false;
                return true;
            });

            if(filteredTasks.length === 0) {
                listEl.innerHTML = `<div class="empty-tip">目前沒有作業，休息一下吧！☕</div>`;
                return;
            }

            filteredTasks.forEach(task => {
                const li = document.createElement('li');
                if(task.completed) li.classList.add('completed');

                li.innerHTML = `
                    <div class="task-info">
                        <input type="checkbox" ${task.completed ? 'checked' : ''} onclick="toggleTask(${task.id})">
                        <span class="task-text">${escapeHtml(task.text)}</span>
                    </div>
                    <button class="delete-btn" onclick="deleteTask(${task.id})">🗑️</button>
                `;
                listEl.appendChild(li);
            });
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // 網頁開啟時自動從雲端同步一次
        fetchTasksFromCloud();
    </script>
</body>
</html>
